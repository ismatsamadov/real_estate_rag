<!doctype html>
<link rel="icon" href="/../public/favicon/favicon.ico" />
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Estate RAG Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">PGVECTOR + ANTHROPIC</p>
        <h1>Real Estate RAG Console</h1>
        <p class="subtitle">Grounded answers with explicit source citations and chunk-level traceability.</p>
      </header>

      <section class="panel ask-panel">
        <label for="question">Ask a question</label>
        <textarea id="question" placeholder="Example: What premium apartment projects are available in Baku and what are the key amenities?"></textarea>

        <div class="controls">
          <div class="slider-wrap">
            <span>Top K</span>
            <input id="topK" type="range" min="3" max="15" value="8" />
            <strong id="topKValue">8</strong>
          </div>
          <button id="askBtn" type="button">Ask RAG</button>
        </div>
      </section>

      <section class="panel answer-panel">
        <div class="panel-title-row">
          <h2>Answer</h2>
          <button id="copyBtn" class="ghost-btn" type="button">Copy</button>
        </div>
        <div id="status" class="status">Ready.</div>
        <article id="answer" class="answer-content"></article>
      </section>

      <section class="panel sources-panel">
        <h2>Traceable Sources</h2>
        <div id="sources" class="source-grid"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
  </html>
